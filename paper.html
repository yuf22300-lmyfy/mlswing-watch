<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML-Swing 实测手册 · 模拟盘 1000U</title>
<script src="echarts.min.js"></script>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e; --up:#3fb950; --dn:#f85149; --acc:#58a6ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:"Microsoft YaHei",system-ui,sans-serif; font-size:14px; }
  .wrap { max-width:1180px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:14px 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:18px; }
  h2 { font-size:16px; margin:28px 0 12px; border-left:3px solid var(--acc); padding-left:10px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .kpi .v { font-size:20px; font-weight:700; margin-top:4px; }
  .kpi .k { color:var(--dim); font-size:12px; }
  .chart { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; height:300px; }
  table { width:100%; border-collapse:collapse; background:var(--card); font-size:13px; }
  th { background:#1c2129; color:var(--dim); text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:6px 10px; border-bottom:1px solid #21262d; white-space:nowrap; }
  tr:hover td { background:#1c2129; }
  .W { color:var(--up); font-weight:700; } .L { color:var(--dn); } .BE { color:var(--dim); }
  .side-L { color:var(--up); } .side-S { color:var(--dn); }
  .tbl-box { border:1px solid var(--line); border-radius:10px; overflow:auto; max-height:520px; }
  .pill { display:inline-block; border-radius:12px; padding:2px 10px; font-size:12px; border:1px solid var(--line); }
  .pill.hot { color:#f85149; border-color:#f8514966; } .pill.cold { color:#3fb950; border-color:#3fb95066; } .pill.mid { color:#8b949e; }
  .note { color:var(--dim); font-size:12px; line-height:1.7; }
  a { color:var(--acc); text-decoration:none; }
  .foot { margin-top:36px; color:var(--dim); font-size:12px; border-top:1px solid var(--line); padding-top:14px; line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ML-Swing 实测手册 <span style="font-size:13px;color:var(--dim)">模拟盘 · 1,000U · 1% 风险/单</span></h1>
  <div class="sub"><a href="index.html">← 回测手册(905笔档案)</a> · 引擎每 5 分钟扫描,数据经 git 推送刷新(Pages 缓存约 1-10 分钟) · 开始于 <span id="st"></span> · 最后扫描 <span id="upd"></span></div>

  <div class="kpis" id="kpis"></div>

  <h2>模拟盘权益曲线</h2>
  <div class="chart" id="eq"></div>

  <h2>当前持仓(<span id="nOpen"></span>)</h2>
  <div class="tbl-box"><table>
    <thead><tr><th>开仓日</th><th>币</th><th>方向</th><th>买法</th><th>入场</th><th>止损</th><th>现价</th><th>浮动R</th><th>浮盈U</th><th>3R减仓</th><th>保本锁</th></tr></thead>
    <tbody id="tbOpen"></tbody>
  </table></div>

  <h2>已平仓流水(<span id="nCl"></span>)</h2>
  <div class="tbl-box"><table>
    <thead><tr><th>开仓日</th><th>平仓日</th><th>币</th><th>方向</th><th>买法</th><th>入场</th><th>出场</th><th>持有天</th><th>结果</th><th>R</th></tr></thead>
    <tbody id="tbCl"></tbody>
  </table></div>

  <div class="foot" id="foot"></div>
</div>
<script src="paper_data.js"></script>
<script>
const M = PAPER.meta, P = PAPER.positions, C = PAPER.closed, S = PAPER.equitySeries;
const SETUP = {B:"突破", P:"回调", Bs:"突破·空", Ps:"回调·空", WICK:"接针"};
document.getElementById("st").textContent = M.started;
document.getElementById("upd").textContent = M.updated.replace("T"," ").slice(0,19) + " UTC";
document.getElementById("nOpen").textContent = M.nOpen;
document.getElementById("nCl").textContent = M.nClosed;
const ret = (M.equity / M.start - 1) * 100;
const gatePill = M.gate.includes("多头") ? '<span class="pill hot">多头区</span>' : M.gate.includes("空头") ? '<span class="pill cold">空头区</span>' : '<span class="pill mid">中性区·不开新仓</span>';
const kpis = [
  ["当前权益", M.equity.toFixed(2) + " U", "var(--acc)"],
  ["累计收益", (ret>=0?"+":"") + ret.toFixed(2) + "%", ret>=0?"var(--up)":"var(--dn)"],
  ["已平仓 ΣR", (M.sumR>=0?"+":"") + M.sumR + "R", M.sumR>=0?"var(--up)":"var(--dn)"],
  ["平仓胜率", M.wr===null?"—":M.wr+"%", ""],
  ["现金/持仓", M.cash.toFixed(0) + " / " + M.nOpen, ""],
  ["指数闸门", gatePill, ""],
];
document.getElementById("kpis").innerHTML = kpis.map(k=>`<div class="kpi"><div class="k">${k[0]}</div><div class="v" style="color:${k[2]||"var(--txt)"}">${k[1]}</div></div>`).join("");
const ec = echarts.init(document.getElementById("eq"));
ec.setOption({ backgroundColor:"transparent", textStyle:{color:"#8b949e"},
  tooltip:{trigger:"axis"}, grid:{left:55,right:20,top:15,bottom:30},
  xAxis:{type:"time", axisLabel:{color:"#8b949e"}},
  yAxis:{type:"value", scale:true, axisLabel:{color:"#8b949e",formatter:"{value}U"}, splitLine:{lineStyle:{color:"#21262d"}}},
  series:[{type:"line", data:S.map(x=>[x.t, x.eq]), showSymbol:false, lineStyle:{color:"#58a6ff",width:1.5}, areaStyle:{color:"rgba(88,166,255,0.08)"}}]});
window.addEventListener("resize",()=>ec.resize());
document.getElementById("tbOpen").innerHTML = P.length ? P.map(p=>`<tr>
  <td>${p.d}</td><td><b>${p.coin}</b></td><td class="side-${p.side}">${p.side==="L"?"多":"空"}</td>
  <td>${SETUP[p.setup]||p.setup}</td><td>${p.entry}</td><td>${p.stop}</td><td>${p.mark}</td>
  <td class="${p.openR>0?"W":"L"}">${p.openR>0?"+":""}${p.openR}</td>
  <td class="${p.uPnl>0?"W":"L"}">${p.uPnl>0?"+":""}${p.uPnl}U</td>
  <td>${p.partial?"✓已减":"—"}</td><td>${p.be?"✓":"—"}</td></tr>`).join("")
  : `<tr><td colspan="11" style="color:var(--dim);text-align:center;padding:22px">空仓 watching —— 引擎每 5 分钟检查突破/回调信号${M.gate.includes("中性")?"(当前中性区,闸门关闭)":""}</td></tr>`;
document.getElementById("tbCl").innerHTML = C.length ? C.map(t=>`<tr>
  <td>${t.d}</td><td>${t.exitD}</td><td><b>${t.coin}</b></td><td class="side-${t.side}">${t.side==="L"?"多":"空"}</td>
  <td>${SETUP[t.setup]||t.setup}</td><td>${t.entry}</td><td>${t.exit}</td><td>${t.hold}</td>
  <td class="${t.outcome}">${t.outcome==="W"?"盈":t.outcome==="L"?"亏":"平"}</td>
  <td class="${t.r>0?"W":"L"}">${t.r>0?"+":""}${t.r}</td></tr>`).join("")
  : `<tr><td colspan="10" style="color:var(--dim);text-align:center;padding:22px">尚无平仓 —— 模拟盘刚开始,等第一笔信号</td></tr>`;
document.getElementById("foot").innerHTML =
`规则与回测手册完全同源(1H 突破/回调 + 空头镜像 + G1 指数闸门;接针模块 v1.1 待加)。<br>
纸面验收标准:两周后逐笔对账——成交价 vs 信号价(滑点)、R 分布 vs 回测(26%胜率/7.3R均赢)、闸门行为。<br>
引擎:workspace/_mlswing_live/mlswing_paper.js · 计划任务 MLSwing_Paper 每5分钟 · 状态 state.json · 免责:模拟数据,非投资建议。`;
</script>
</body>
</html>
